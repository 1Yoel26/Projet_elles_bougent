titre="Des femmes et des hommes qui montrent que c’est possible"
description="<p>Les marraines Elles bougent sont des femmes ingénieures ou techniciennes dans les secteurs scientifiques, techniques et technologiques.&nbsp;</p> <p>Elles s’engagent bénévolement pour transmettre, inspirer et ouvrir des perspectives aux filles, en incarnant des rôles modèles accessibles, authentiques et diversifiés.&nbsp;</p> <p>À travers leurs témoignages, leurs échanges sur le terrain ou en ligne, elles montrent que les carrières scientifiques sont à la portée de toutes.&nbsp;</p> <p>À leurs côtés, les relais Elles bougent – ingénieurs, techniciens, professionnel·les RH – s’impliquent eux aussi pour faire découvrir les métiers scientifiques et techniques, témoigner de leur parcours et déconstruire les stéréotypes.&nbsp;</p>"
