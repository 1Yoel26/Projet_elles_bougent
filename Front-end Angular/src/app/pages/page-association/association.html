<app-bloc-texte-image
titre="Transmettre sa passion, susciter des vocations"
description="Fondée en 2006, l’association Elles bougent agit pour favoriser la mixité dans les secteurs scientifiques, technologiques et industriels en encourageant les jeunes filles à s’orienter vers les métiers d’ingénieure et de technicienne.

Grâce à un réseau de bénévoles, professionnels et partenaires, elle organise des actions concrètes (interventions en classe, visites de sites, rencontres, événements) pour déconstruire les stéréotypes, inspirer et accompagner les filles dès le primaire."

titreBouton="En savoir plus sur notre mission"
cheminImage="images/images-menu/subnav-chiffres.jpg"
>

</app-bloc-texte-image>

<app-espace-petit></app-espace-petit>

<app-bloc-image-texte
titre="Organisation de l'association"
description="Elles bougent repose sur un écosystème engagé qui réunit bénévoles, partenaires et établissements éducatifs. L’association est structurée autour d’un bureau et d’un conseil d’administration qui définissent ses orientations stratégiques, et d’une équipe salariée qui pilote au quotidien les projets, les partenariats et la communication.

Elle s’appuie sur un réseau actif de marraines, relais, pilotes opérationnels et déléguées régionales pour déployer ses actions au plus près du terrain et sensibiliser les filles dès le plus jeune âge et tout au long de leur parcours."

titreBouton="Découvrir notre organistaion"
cheminImage="images/images-menu/subnav-international.jpg"
>

</app-bloc-image-texte>
