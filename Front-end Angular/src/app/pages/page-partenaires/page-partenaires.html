titre="Un engagement collectif au service de la mixité"
description="Entreprises, établissements d’enseignement supérieur, fédérations, institutions, associations… Nos partenaires sont engagés à nos côtés pour construire une industrie plus mixte, plus inclusive et plus innovante. 

Leur objectif : encourager davantage de filles à s’orienter vers les filières scientifiques et techniques et y construire leur avenir.  

Grâce à l’engagement des marraines et relais, ils font découvrir leurs secteurs, leurs métiers, les formations qui y mènent et les opportunités professionnelles à saisir. 

Ils accueillent les filles sur leurs sites, participent à des forums, ouvrent leurs portes et s’impliquent dans nos événements, en France comme à l’international."
