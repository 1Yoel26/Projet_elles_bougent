<app-bloc-texte-image
titre="Notre histoire"
description="
L’histoire d’Elles bougent commence en 2005, quand quatre groupes industriels sollicitent Marie-Sophie Pawlak, fondatrice de l'association, ingénieure et directrice des relations extérieures d’une école d’ingénieurs, face au manque de profils féminins dans leurs recrutements.

Très vite, une idée s’impose à Marie-Sophie : pour susciter des vocations, il faut permettre aux filles de rencontrer des femmes ingénieures et techniciennes en poste qui leur ressemblent et dans lesquelles elles peuvent s'identifier et se projeter. 

L’association voit officiellement le jour en décembre 2005, avec pour ambition d’agir au plus près des filles sur tous les territoires en leur faisant découvrir la réalité des métiers et des secteurs industriels et technologiques.
"
cheminImage="/images/images-menu/subnav-chiffres.jpg"
>

</app-bloc-texte-image>


<app-bloc-image-texte
titre="Notre mission"
description=
"
Elles bougent œuvre pour renforcer la mixité dans les secteurs scientifiques, technologiques et industriels, en donnant aux jeunes filles les clés pour s’orienter vers les métiers d’ingénieure et de technicienne.

L’association s’appuie sur l’engagement de ses bénévoles, professionnelles et professionnels passionnés, véritables rôles modèles, ainsi que de ses partenaires et délégations sur tout le territoire. Dès le primaire, Elles bougent agit pour déconstruire les stéréotypes, éveiller la curiosité, inspirer et accompagner les filles vers des parcours d’avenir.

Pour cela, l’association mène des actions concrètes sur le terrain : interventions en classe, visites de sites, rencontres avec des rôles modèles, événements et programmes éducatifs, qui permettent aux jeunes filles de découvrir la diversité des métiers et des parcours scientifiques et techniques.
"

titreBouton="Découvrir nos actions"

cheminImage="images/images-menu/subnav-chiffres.jpg"
>

</app-bloc-image-texte>
